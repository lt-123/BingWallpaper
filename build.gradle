plugins {
    id 'com.android.application' version '9.2.0' apply false
}

ext {
    def vc = getVersionCode()
    println "versionCode = " + vc

    versionCode = vc
    versionName = "2.2." + vc
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}

int getVersionCode() {
    def process = new ProcessBuilder('git', 'rev-list', 'HEAD', '--count')
            .directory(rootDir)
            .redirectErrorStream(true)
            .start()
    def output = process.inputStream.text.trim()
    process.waitFor()

    return process.exitValue() == 0 && output.isInteger() ? output.toInteger() : 1
}
